name: Integration release checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build
      - name: Backend regression tests (isolated, no live database)
        run: |
          npm ci --prefix supabase/tests
          for test in supabase/tests/*.test.mjs; do node --experimental-strip-types "$test"; done
      - name: Dependency security report
        run: npm audit --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-security-report
          path: dependency-audit.json
          if-no-files-found: ignore
