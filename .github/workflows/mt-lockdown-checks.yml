name: MT lockdown release checks

on:
  push:
    branches: [feature/mt-auto-sync-lockdown]
  pull_request:
    branches: [main, lovable-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: node scripts/test-mt-lockdown.mjs
      - run: npm run build
      - name: Install browser test tooling (verification only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Coming Soon desktop and mobile layout
        run: node scripts/check-mt-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mt-lockdown-layout
          path: artifacts/mt-lockdown
          if-no-files-found: ignore
