name: Trading Review Checks
on:
  pull_request:
    paths:
      - 'src/lib/review/**'
      - 'src/components/journal/**'
      - 'src/components/AddTradeModal.tsx'
      - '.github/workflows/review-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build
