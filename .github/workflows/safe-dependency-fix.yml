name: Safe Dependency Fix

on:
  push:
    paths:
      - ".github/workflows/safe-dependency-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-audit --no-fund || true
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet package-lock.json; then
            echo "No safe lockfile changes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Apply safe dependency security updates"
          git push
